<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>My account · MoMS</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=3c8b67ae">
  <link rel="stylesheet" href="profile.css?v=a5420f91">
</head>
<body>
  <header class="topbar">
    <span></span>
    <a class="title" href="/" aria-label="The Museum of Mini Skateboards"><span class="t-full">The Museum of Mini Skateboards</span><span class="t-short">MoMS</span></a>
    <a class="insta" href="/signin.html">Sign in</a>
  </header>

  <main class="auth" id="acct" hidden>
    <h1>My account</h1>
    <p class="auth-note">Signed in as <b id="a-email"></b><br>Your page: <a id="a-page" class="auth-link"></a></p>

    <h2 class="acct-h">Password</h2>
    <p class="auth-note">Set a password so you can sign in without waiting for an email.</p>
    <form id="f-pass" class="auth-form">
      <input id="p1" type="password" placeholder="New password (8+ characters)" autocomplete="new-password" minlength="8" required>
      <input id="p2" type="password" placeholder="Type it again" autocomplete="new-password" minlength="8" required>
      <button type="submit" class="auth-btn">Save password</button>
    </form>
    <p id="a-msg" class="auth-note" aria-live="polite"></p>

    <p class="auth-alt"><button class="auth-link" id="a-out">Sign out</button></p>
    <p class="auth-alt">Need to change your username or delete your account? Email <a class="auth-link" href="mailto:contact@museumofminiskateboards.org">contact@museumofminiskateboards.org</a>.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="moms-config.js?v=e1dbbd27"></script>
  <script src="account.js?v=e25febbd"></script>
  <script src="site.js?v=cb88be88"></script>
</body>
</html>
