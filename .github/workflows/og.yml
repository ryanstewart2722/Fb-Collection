# Link-preview pictures (what shows when someone shares a link): a screenshot of each page and of every public
# collection, plus a small page at u/<username>/ that carries the preview tags. See scripts/make_og.mjs.
name: Link preview pictures

on:
  schedule:
    - cron: "17 6 * * *" # every morning
  workflow_dispatch: # run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: og
  cancel-in-progress: false

jobs:
  og:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Take the screenshots
        continue-on-error: true   # a bad run is simply retried tomorrow; no failure emails
        run: |
          npm i --no-save --silent playwright-core@1.48.2
          node scripts/make_og.mjs
      - name: Publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "moms-og"
          git config user.email "moms-og@users.noreply.github.com"
          git add og u
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -qm "Link preview pictures"
          for i in 1 2 3; do git pull --rebase -q -X theirs origin main && git push -q origin HEAD:main && break; git rebase --abort 2>/dev/null; sleep 5; done
          for i in 1 2 3 4; do gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null && echo "site build requested" && exit 0; sleep 20; done; echo "could not request a site build"; exit 0
