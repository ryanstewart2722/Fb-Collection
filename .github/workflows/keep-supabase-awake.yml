# Supabase pauses free projects after about a week without activity.
# This loads one board from the museum database every day so it stays awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 * * *" # every day at 14:17 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one board from the database
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://alfsnqpxmptvuvakyzcl.supabase.co/rest/v1/decks?select=id&limit=1" \
            -H "apikey: sb_publishable_fpAMGrL1QxRngyGLfvgy1Q_DByMA1ww")
          echo "Database answered with HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::The museum database didn't respond normally (HTTP $status). It may be paused: restore it at supabase.com/dashboard."
            exit 1
          fi
