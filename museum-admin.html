<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Museum editor · MoMS</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="museum-admin.css">
</head>
<body class="admin">
  <!-- Sign in -->
  <section id="login" class="ad-login" hidden>
    <h2>Museum editor</h2>
    <form id="login-form" class="me-login">
      <input id="email" type="email" placeholder="Email" autocomplete="username" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" class="ad-btn ad-btn-dark">Sign in</button>
    </form>
    <p id="login-error" class="ad-error" hidden></p>
  </section>

  <section id="denied" class="ad-login" hidden>
    <h2>No editing access</h2>
    <p>This account can't edit the museum. Ask the admin to give you editor access.</p>
    <button class="ad-btn" data-signout>Sign out</button>
  </section>

  <!-- Editor -->
  <div id="editor" hidden>
    <header class="ad-top">
      <nav class="ad-tabs">
        <button data-tab="decks">Decks</button>
        <button data-tab="trucks">Trucks</button>
        <button data-tab="wheels">Wheels</button>
        <button data-tab="brands">Brands</button>
      </nav>
      <span id="status" class="ad-status"></span>
      <div class="ad-top-actions">
        <a class="ad-btn" href="./" target="_blank" rel="noopener">View museum ↗</a>
      </div>
    </header>
    <main id="me-app"></main>
    <footer class="ad-foot"><span id="who"></span> · <button class="ad-link" data-signout>Sign out</button></footer>
  </div>

  <input id="file" type="file" accept="image/*" hidden>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="moms-config.js"></script>
  <script src="museum-admin.js"></script>
</body>
</html>
