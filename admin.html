<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Editor · Ryan’s Fingerboards</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=12ed6d01">
  <link rel="stylesheet" href="admin.css?v=5426bc05">
</head>
<body class="admin">
  <!-- Sign in -->
  <section id="login" class="ad-login" hidden>
    <h2>Enter admin password</h2>
    <form id="login-form">
      <input id="token" type="password" placeholder="Admin password" autocomplete="current-password" spellcheck="false">
      <button type="submit" class="ad-btn ad-btn-dark">Enter</button>
    </form>
    <p id="login-error" class="ad-error" hidden></p>
  </section>

  <!-- Editor -->
  <div id="editor" hidden>
    <header class="ad-top">
      <nav class="ad-tabs">
        <button data-tab="list">List</button>
        <button data-tab="grid">Image view</button>
        <button data-tab="site">Site</button>
      </nav>
      <span id="status" class="ad-status"></span>
      <div class="ad-top-actions">
        <a class="ad-btn" href="collection.html" target="_blank" rel="noopener">View collection ↗</a>
        <button id="discard" class="ad-btn" disabled>Discard</button>
        <button id="publish" class="ad-btn ad-btn-dark" disabled>Publish</button>
      </div>
    </header>
    <main id="ad-app"></main>
    <footer class="ad-foot"><button id="logout" class="ad-link">Sign out of editor</button></footer>
  </div>

  <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="admin.js?v=c4eee445"></script>
</body>
</html>
